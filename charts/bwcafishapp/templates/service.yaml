apiVersion: v1
kind: Service
metadata:
  name: {{ include "bwcafish.fullname" . }}
  labels:
    {{- include "bwcafish.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "bwcafish.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}
  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

